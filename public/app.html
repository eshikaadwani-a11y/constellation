<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Constellation — Laboratory</title>
    <link rel="icon" href="/assets/logo.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/styles/theme.css" />
    <link rel="stylesheet" href="/styles/app.css" />

    <!--
      Constellation loads its UI stack as native ES modules from a CDN via this
      import map — no bundler, no node_modules. Versions are pinned. Swap these
      URLs for a local Vite build (and delete web/types/libs.d.ts) when running
      in an environment with package-registry access.
    -->
    <script type="importmap">
      {
        "imports": {
          "react": "https://esm.sh/react@18.3.1",
          "react-dom/": "https://esm.sh/react-dom@18.3.1/",
          "react/jsx-runtime": "https://esm.sh/react@18.3.1/jsx-runtime",
          "@constellation/engine": "/dist/index.js"
        }
      }
    </script>
  </head>
  <body class="app">
    <div id="root">
      <div class="boot">
        <div class="spinner"></div>
        <span>Starting the laboratory…</span>
      </div>
    </div>
    <script type="module" src="/dist/web/main.js"></script>
  </body>
</html>
